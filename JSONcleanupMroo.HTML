const fileContentDisplay = document.getElementById("file-content");

class DoggiDB {
  constructor() {
    this.formatVersion = 1;
    this.exportedAt = new Date().toISOString();
    this.summary = {
      totalKills: 0,
      totalSources: 0,
      totalItems: 0,
    };
    this.sources = {};
  }
  refreshSummary() {
    this.summary.totalSources = Object.keys(this.sources).length;
    this.summary[(totalKills, totalItems)] = [0, 0];
    for (const source in Object.values(this.sources)) {
      for (const entry in source.entries) {
        this.summary.totalKills += entry.kills;
        for (const item in entry.items) {
          this.summary.totalItems += item.quantity;
        }
      }
    }
  }
  updateSummaryFromEntry(new_entry) {
    this.summary.totalSources = Object.keys(this.sources).length;
    this.summary.totalKills += new_entry.kills;
    new_entry.items.forEach((item) => {
      this.summary.totalItems += item.quantity;
    });
  }
  addNewEntry(source_key, new_entry) {
    this.sources[source_key] ||= {};
    this.sources[source_key].entries = (this.sources[source_key]?.entries || []).concat(new_entry);
    this.updateSummaryFromEntry(new_entry);
  }
  populateFromTNT(obj) {
    for (const source_key in obj.sources) {
      this.sources[source_key] ||= {};
      this.sources[source_key].entries ||= [];
      let doggi_entry = new DoggiEntry();
      doggi_entry.fromTNT(source_key, obj);
      if (
        this.sources[source_key].entries.every(
          (e) =>
            (e.name, e.recordedAt) != (doggi_entry.name, doggi_entry.recordedAt)
        )
      ) {
        this.addNewEntry(source_key, doggi_entry);
      } else {
        console.log(
          `ignoring duplicate entry (name= ${doggi_entry.name}, recordedAt= ${doggi_entry.recordedAt})...`,
        );
      }
    }
  }
  populateFromObj(obj) {
    for (const source_key in obj.sources) {
      this.sources[source_key] ||= {};
      for (const entry_index in obj.sources[source_key].entries) {
        this.sources[source_key].entries ||= [];
        // need to check sources against existing source list and then fix the names to match existing ones. fuzzy matching, as the kids might say. -alice
        const new_entry = obj.sources[source_key].entries[entry_index]; 
        if (
          this.sources[source_key].entries.every(
            (e) =>
              (e.name, e.recordedAt) != (new_entry.name, new_entry.recordedAt)
          )
        ) {
          let doggi_entry = new DoggiEntry();
          doggi_entry.fromObj(new_entry);
          this.addNewEntry(source_key, doggi_entry);
        } else {
          console.log(
            `ignoring duplicate entry (name= ${new_entry.name}, recordedAt= ${new_entry.recordedAt})...`,
          );
        }
      };
    }
  }
}
class DoggiEntry {
  constructor() {
    this.kills = 0;
    this.items = new Array();
    this.recordedAt = new String();
    this.name = new String();
  }
  fromTNT(source_key, obj) {
    this.kills = obj.sources[source_key]?.count ?? 0;
    this.items = obj.sources[source_key]?.items ?? [];
    this.recordedAt = obj.recordedAt;
    this.name = obj.name;
  }
  fromObj(entry) {
    this.kills = entry.kills;
    this.items = entry.items;
    this.recordedAt = entry.recordedAt;
    this.name = entry.name;
  }
}
