<!DOCTYPE html>
<html lang="en">
<head>
  <title>JSON cleanup</title>
  <link href="style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Hi+Melody&display=swap" rel="stylesheet">
</head>
<body>
  <h1>DOGGI JSON <s>MERGER</s> SHOW-ER</h1>
  <div class="main">
    <div id="sidebar">
      <div class="sidebarSet">
        <h4>Show File</h4>
        <h4>Submit Main Json</h4>
        <input type="file" id="JSONmain" accept=".json">
        <h4>Submit TNT Json</h4>
        <input type="file" id="JSONtnt" accept=".json">
        <br>
        <h4>Once both files are there, click submit!</h4>
        <button type="button" onclick="handleFileSelection()">Submit</button>
      </div>
    </div>
    <div id="preview">
        <div id="message"></div>
<pre id="file-content"></pre>
    </div>
  </div>

  <script>
const fileContentDisplay = document.getElementById("file-content");
const messageDisplay = document.getElementById("message");
const fileInput = document.getElementById("JSONmain");
const fileInput2 = document.getElementById("JSONtnt");

function handleFileSelection() {
  const fileMain = fileInput.files[0];
  const fileTNT = fileInput2.files[0];
  fileContentDisplay.textContent = ""; // Clear previous file content
  messageDisplay.textContent = ""; // Clear previous messages

  // Validate file existence and type
  if (!fileMain || !fileTNT) {
    showMessage("No file selected. Please choose a file. >:(", "error");
    return;
  }

  // Read the file
  const readerMain = new FileReader();
  const readerTNT = new FileReader();
  readerMain.addEventListener("load", (event) => {
    // shows file for added clarity
    fileContentDisplay.textContent += readerMain.result;
    mainReading = JSON.parse(readerMain.result);
    // check that it actually parses it as JSON
    console.log(mainReading.sources);
  });
  readerTNT.addEventListener("load", (event) => {
    // shows file for added clarity
    fileContentDisplay.textContent += readerTNT.result;
    tntReading = JSON.parse(readerTNT.result);
    // check that it actually parses it as JSON
    console.log(tntReading.sources);
    // grab the TNT logger's name and recording date.
    doggiName = tntReading.name;
    doggiRecord = tntReading.recordedAt;
    console.log(doggiName + doggiRecord);
    // grab number of unique sources from TNT logs for number of iterations.
    sourceNames = Object.keys(tntReading.sources);
    console.log(sourceNames.length);
    
    //loop sourceNames.length amount of times, then add name + record and change "count" to "kills" for each of the sources.
    // also add up all of the kills/number of items, if possible.


  });
  // reads fileMain first, does reader.onload() then does fileTNT. Shouldn't TNT overwrite Main? 
  readerMain.readAsText(fileMain);
  readerTNT.readAsText(fileTNT);
  // Check that sourceNames from TNT match up with sourceNames from MAIN. Then create new "entry" using the information.
  // add kills and number of items to MAIN's header.
  // then export as new merged JSON.
}

// Displays a message to the user
function showMessage(message, type) {
  messageDisplay.textContent = message;
  messageDisplay.style.color = type === "error" ? "red" : "green";
}

  </script>
</body>

</html>
